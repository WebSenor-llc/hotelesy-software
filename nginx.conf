# Nginx config for Heroku PHP buildpack on DigitalOcean App Platform.
# Sets the document root, enables Laravel-friendly URL rewriting, and tightens upload limits.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass heroku-fcgi;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

# Block access to dotfiles except .well-known (Let's Encrypt etc.)
location ~ /\.(?!well-known).* {
    deny all;
}

# Cache static assets aggressively
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
}

# 50 MB max upload (passport scans / room photos)
client_max_body_size 50M;
